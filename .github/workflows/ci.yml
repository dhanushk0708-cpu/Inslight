name: INSLIGHT CI

on:
  push:
    branches: [main, develop, react-conversion]
  pull_request:
    branches: [main, develop]

jobs:
  backend-tests:
    name: Backend Pytest & Migration Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Alembic migrations
        env:
          DATABASE_URL: sqlite:///./data/ci_test.db
        run: |
          mkdir -p data
          alembic upgrade head

      - name: Run Backend Test Suite
        env:
          SECRET_KEY: ${{ secrets.CI_SECRET_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          RATE_LIMIT_ENABLED: "false"
        run: |
          pytest tests -v --tb=short

  frontend-build:
    name: Frontend TypeScript & Next.js Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install frontend dependencies
        run: npm ci

      - name: TypeScript type check
        run: npx tsc --noEmit

      - name: Next.js production build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
        run: npm run build
